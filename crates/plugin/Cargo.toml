[package]
name = "nautilus-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
authors.workspace = true
license.workspace = true
description = "Plug-in system for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_plugin"
crate-type = ["rlib"]

[features]
default = []
component-binding = ["dep:nautilus-core"]
# Compatibility feature retained for downstream manifests
host = ["dep:libc", "dep:sha2"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-core = { workspace = true, optional = true }
nautilus-model = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
libc = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
rstest = { workspace = true }

[[example]]
name = "contract_counter"
path = "examples/contract_counter.rs"
crate-type = ["cdylib"]

[[example]]
name = "contract_interval"
path = "examples/contract_interval.rs"
crate-type = ["cdylib"]

[[example]]
name = "contract_facade"
path = "examples/contract_facade.rs"
crate-type = ["cdylib"]

[[example]]
name = "contract_managed"
path = "examples/contract_managed.rs"
crate-type = ["cdylib"]
